<!DOCTYPE html>
<html>
<head>
  <!-- Favicon -->
  <link rel="shortcut icon" href="./src/images/icon.png" type="image/x-icon">

  <!-- External CSS -->
  <link rel="stylesheet" type="text/css" href="https://runeapps.org/nis/nis.css" />
  <!-- External JS -->
  <script type="text/javascript" src="https://runeapps.org/runeappslib.js"></script>
  <script type="text/javascript" src="https://www.unpkg.com/@alt1/base/dist/index.bundle.js"></script>
  <script type="text/javascript" src="https://www.unpkg.com/@alt1/ocr/dist/index.bundle.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" type="text/css" href="./src/css/style.css" >
  <!-- JS -->
  <script type="text/javascript" src="./src/js/vorago-image-detect.js"></script>
  <script type="text/javascript" src="./src/js/timer.js"></script>
  <script type="text/javascript" src="./src/js/settings.js"></script>
  <script type="text/javascript" src="./src/app.js"></script>
</head>
<body class="nis" onload="initialize();">

  <!-- Main content -->
  <main class="progress-bar">
    <div class="progress-bar__overlay">
      <div class="progress-bar__color-bar" id="progressBarColorBar">
      </div>
      <div class="progress-bar__tc-text" id="progressBarTcText">
        ready
      </div>
      <div class="progress-bar__special-tick-timeline">
        <div class="progress-bar__special-tick-timeline__tick" id="tickTimelineCurrentTick">
        </div>
        <div class="progress-bar__special-tick-timeline__tick" id="tickTimelineSecondTick">
        </div>
        <div class="progress-bar__special-tick-timeline__tick" id="tickTimelineThirdTick">
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="d-flex-center">
    <div
      id="settingsButton"
      title="Settings"
      type="button"
      class="nisbutton nissmallbutton"
      onclick='window.open("./src/settings.html", "_blank", "height=200, width=200, status=yes, toolbar=no, menubar=no, location=no,addressbar=no");'
    >
      Settings
    </div>
  </footer>
  <div id="browserContainer" class="d-flex-center hidden">
    <div title="Add to Alt1 URL" class="nistext add-to-alt1-url">
      Copy this URL and open in new tab to add to Alt1:
      <div id="addURL" class="add-to-alt1-url__url">
      </div>
    </div>
    <div class="debug-container d-flex-center">
      <h2>Debugging</h2>
      <div
        id="startTimerButton"
        title="Start timer"
        type="button"
        class="nisbutton nissmallbutton"
        onclick='startTimer();'
      >
        Start timer
      </div>
    </div>
  </div>
</body>
</html>
