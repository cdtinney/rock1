<!DOCTYPE html>
<html>
<head>
	<!-- External CSS -->
	<link rel="stylesheet" type="text/css" href="https://runeapps.org/nis/nis.css" />
	<!-- External JS -->
  <script type="text/javascript" src="https://runeapps.org/runeappslib.js"></script>
  <script type="text/javascript" src="https://www.unpkg.com/@alt1/base/dist/index.bundle.js"></script>
  <script type="text/javascript" src="https://www.unpkg.com/@alt1/ocr/dist/index.bundle.js"></script>

	<!-- CSS -->
	<link rel="stylesheet" type="text/css" href="./src/css/style.css" >
	<!-- JS -->
	<script type="text/javascript" src="./src/js/vorago-image-detect.js"></script>
	<script type="text/javascript" src="./src/js/timer.js"></script>
	<script type="text/javascript" src="./src/js/settings.js"></script>
	<script type="text/javascript" src="./src/app.js"></script>
</head>
<body class="nis" onload="initialize();">

	<!-- Main content -->
	<main>
		<span class="timer-text" id="timerText">
			Ready
		</span>
		<div class="progress-bar">
			<div class="progress-bar__inner" id="progressBar">
          -10t
			</div>
		</div>
	</main>

	<!-- Footer -->
	<footer class="footer">
		<div
			id="settingsButton"
			title="Settings"
			type="button"
			class="nisbutton nissmallbutton"
			onclick='window.open("./src/settings.html", "_blank", "height=125, width=200, status=yes, toolbar=no, menubar=no, location=no,addressbar=no");'
		>
			Settings
		</div>
	</footer>
	<div
		id="addToAlt1Url"
		title="Add to Alt1 URL"
		class="nistext hidden add-to-alt1-url"
	>
		Copy this URL and open in new tab to add to Alt1:
		<div class="add-to-alt1-url__url">
			alt1://addapp/http://127.0.0.1:8080/appconfig.json
		</div>
	</div>
</body>
</html>
