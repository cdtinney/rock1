<!DOCTYPE html>
<html>
  <head>
    <!-- External CSS -->
    <link rel="stylesheet" type="text/css" href="https://runeapps.org/nis/nis.css" />

    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="./css/style.css" >
    <link rel="stylesheet" type="text/css" href="./css/settings.css" >
    <!-- JS -->
    <script type="text/javascript" src="./js/settings.js"></script>
  </head>
  <body class="nis" onload='initializeSettingsForm();'>
    <!-- Settings form -->
    <div class="settings">
      <form name="settingsForm">
        <!-- Timer display type -->
        <fieldset id="timerDisplayType">
          <legend>Timer display type</legend>

          <div>
            <input type="radio" id="ticks" name="timerDisplayType" value="1">
            <label for="ticks">Ticks</label>
          </div>

          <div>
            <input type="radio" id="seconds" name="timerDisplayType" value="2">
            <label for="seconds">Seconds</label>
          </div>
        </fieldset>
        <!-- Timer offset -->
        <fieldset id="timerOffset">
          <legend>Timer offset</legend>

          <div>
            <input type="checkbox" id="addOne" name="addOne" />
            <label for="addOne">Add one</label>
          </div>
        </fieldset>
      </form>
    </div>

    <!-- Save and close -->
    <div class="footer">
      <button id="saveButton" class="nisbutton nissmallbutton">
        Save and close
      </button>
    </div>
  </body>
</html>
